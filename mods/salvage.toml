name = "Salvage"
summary = "The all-recycling mod: smelt leather, wood, stone, diamond gear, shells and the elytra back into useful materials, and break down armour and tools at the crafti"
description = """
Nothing in that chest is trash anymore. Salvage — the all-recycling mod — turns old gear back into useful materials.

Leather helmets from zombie drops, stone pickaxes you outgrew, diamond swords you are done with, an elytra you never fly, saddles from horses you never ride — put them in a furnace with any fuel and get leather, charcoal, cobblestone, diamonds, turtle scutes or phantom membrane back, plus a little experience for your trouble."""
