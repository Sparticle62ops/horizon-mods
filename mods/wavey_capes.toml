summary = "Physically simulated capes: the upstream Wavey Capes client logic, translated 1:1, with wind, movement simulation, its config screen and render layer."
description = """**A native Horizon mod**: the launcher builds it into the game (install it on the launcher's Mods page, then press Build there). Native mods are not sandboxed and run with your account's rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

An exact 1:1 Rust translation of [Wavey Capes](https://modrinth.com/mod/wavey-capes): the upstream Java by tr7zw translated code-for-code, carrying the upstream license and credit in full.

All upstream modules (base, simulation, wind, render layers, NMS util, versionless glue, config screen and mod menu, plus the support-mod integrations for Ears, MinecraftCapes, Wynntils and LabyCloak) are carried 1:1 as a Horizon client runtime splice, with crate:: mapped to super:: for the carrier. Host seams where the Minecraft and Fabric APIs do not exist in Horizon live behind the port's seam traits.

Port of [tr7zw/WaveyCapes](https://github.com/tr7zw/WaveyCapes), copyright (C) tr7zw, LicenseRef-tr7zw-Protective-License (no commercial use): the license text ships with the source. Rust port by sparticle, upstream by tr7zw."""
