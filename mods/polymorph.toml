## Horizon registry entry for Polymorph (exact 1:1 Rust translation of the LGPL-3.0 mod).
id = "polymorph"
kind = "native-mod"
name = "Polymorph"
summary = "Recipe conflict resolution: every recipe matching a grid is offered and one can be picked."
description = """**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

An exact 1:1 Rust translation of [Polymorph](https://modrinth.com/mod/polymorph): the upstream Java by Illusive Soulworks translated code-for-code, carrying the upstream license and credit in full.

- **Conflict matching engine**: the matching engine from upstream's `AbstractRecipeData` - every recipe of a menu's type that fits the current input is a conflict candidate, the set is sorted by resource id, and a selection stays valid while the input is unchanged; on an input change or a recipe reload it re-matches and clears.
- **Selection stores**: a per-player selection for the crafting menus and a per-block-entity one for furnaces, smithing tables and the crafter, so the world remembers what each player picked.
- **Resolution override**: server-side recipe resolution prefers the stored selection before it falls back to vanilla's pick.
- **Selection UI**: the output button and the conflict list, driven through Horizon's recipe panel, plus the `/polymorph conflicts` scan over the recipe manager.

Port of [illusivesoulworks/polymorph](https://github.com/illusivesoulworks/polymorph), copyright 2020-2022 Illusive Soulworks, LGPL-3.0-or-later: the LGPL text ships with the source and every file keeps the upstream header. Degradation: Horizon exposes the crafting-grid result override but its furnace and crafter hooks are notify-only, so those stations' overrides wait on engine hooks; tracked under horizon-rust/horizon #16679. 66 unit tests on the translated logic. Rust port by sparticle, upstream by Illusive Soulworks."""
