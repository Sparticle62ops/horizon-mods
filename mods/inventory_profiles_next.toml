name = "Inventory Profiles Next"
summary = "Inventory sorting and profiles for Horizon."
description = """Inventory sorting and profiles for Horizon. Exact 1:1 Rust port of [Inventory Profiles Next](https://codeberg.org/Inventory-Profiles-Next-Mod/IPN) (AGPL-3.0-or-later, upstream LICENSE shipped in the package), ported for the Horizon client by sparticle.

## What ships today

The inventory core, compiled and tested on the pinned SDK: the container grid model (width-by-height stacks), IPN's sorting comparators (by item name, by name then count, by count), ascending/descending order, the rows/columns layout switch, and the minimal move plan that turns a sort into the shortest list of slot moves (each displaced stack moves once; already-sorted grids produce zero moves). 7/7 tests.

## Horizon feature gaps, tracked on horizon-rust/horizon

- Client container-screen interaction: IPN's point is acting on the player's real inventory (read the open screen's slots, perform the move plan as slot clicks). Horizon's mod API does not expose a client surface for container-screen slot reads and clicks yet; the glue wires to it when it lands. (A dedicated issue is linked from the PR.)

Profiles (per-screen save/load of configurations), locked slots and item filters land with the screen glue.

Pinned to Horizon f00125f61f794aaa3d4e950d301f353b35b6ee3d, horizon-mixins e59da9094f0c2fdda6c627fe9eff22dec6a906f0 and mod API 0.2; exact 1:1 Rust port tested against those revisions.

Licence: AGPL-3.0-or-later (upstream, carried). Source: https://github.com/Sparticle62ops/horizon-inventory-profiles-next
"""
