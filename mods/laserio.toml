changelog = """Slice 2, channels as routing: a card's channel now decides where its stacks go. Upstream hands a stack only to inserter cards on the same channel and takes nothing when none answers, so until now the port's channel was decorative — every insert endpoint in a network was a destination, and the mod's central routing rule was missing. The service and destination order now carry the channel, the card stores it, and `/laserio channel` sets it. Five carried recipes were dead and are fixed, with their second half: all five used the 1.21.1 `{"item": …}` ingredient form the pin rejects, and the `c:` tags they name exist in no target data, so even the right shape could not match — the port now declares the seven tags it needs. Proven in game: the five recipes craft with their ingredients consumed and a wrong pattern crafts nothing; a channel-3 extract card fills the channel-3 card 20/20 and leaves the channel-0 card at 0; moving that card to channel 5 makes the extract card take nothing while the source keeps 20; and returning it receives all 20."""
