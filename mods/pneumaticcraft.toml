changelog = """Slice 2, pressure tubes and the network between them: the three tubes, their six-sided connection state, per-tube volumes and tiers, network dispersion by volume, and the dead-end leak. Deferred within the same gap line: the pneumatic wrench and closed sides, tube modules, camouflage, waterlogging and the junction. One trap is recorded for every future cable-like port: a block-entity write made **during** a tick is overwritten by that entity's own write-back — a four-handler network at 25 bar lost about 200,000 mL in 40 ticks that way — so the port now applies writes in `level_tick_post` as deltas on the target's current value. Proven in game: a pair moves 2,216 mL for 5,560 FE in 139 ticks; a chain at 24.90 bar feeds a dynamo from 3,648 to 9,490 FE; a ring of four splits 4,000 mL into four 1,000 mL tubes; a dead end vents to 16 mL over 221 ticks; and each tube tier keeps upstream's volume when it is alone."""
