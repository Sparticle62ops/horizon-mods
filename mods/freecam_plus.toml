id = "freecam_plus"
kind = "native-mod"
name = "Freecam+"
summary = "Fly the camera anywhere while your player stays perfectly still."
description = """
Press U and your camera leaves your body. Fly it with WASD, Space and Shift, hold Ctrl to go faster and use the mouse wheel to change the speed. Your player does not move or turn, so the server sees you standing still. Through walls, speed and the key can be changed in Options, Mods, Freecam+.

A native mod: it needs a Horizon Nightly, not the v0.2.97 release. Each version is made for one Nightly, and the launcher builds it for the Horizon your instance plays."""
authors = ["_idom_"]
