name = "Smooth F5"
summary = "Smooths the third-person camera: no hard snaps when you toggle F5, gentle springs while you move, an eased return to first person."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- No hard camera snaps when toggling between perspectives.
- Gentle camera springs while you move; eased return into first person.

Port of [Smooth F5](https://github.com/Coun7ered/smooth_f5) by Countered (CC0-1.0); credited upstream, original license preserved. Feature gaps vs upstream are documented in the port README and tracked on horizon-rust/horizon.
"""
