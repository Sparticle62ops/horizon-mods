name = "show_me_your_skin"
summary = "A Horizon port of Show Me Your Skin!."
description = """show_me_your_skin: exact 1:1 Rust port of enjarai/show-me-your-skin (Codeberg, MIT (c) 2022 enjarai), read upstream at dd4f63e. Every upstream class is translated code-for-code; Minecraft/Fabric surfaces (mixins, owo-net, CCA components, braid GUI, keybinds) sit behind `seams`, exactly where the Java mod calls into the engine.

Port by sparticle. Upstream: https://codeberg.org/enjarai/show-me-your-skin (MIT).

Package ships the full modular source (src/** with the real mod API entry, no [[native.module]] paste row) on the current SDK (Horizon f00125f / mixins e59da90).

Honest status: nothing of this is visible in game yet. No client tick, render/model-wrap, packet-registration or settings surface exists in the client mod API, so no armor visibility changes in game. The logic runs its tests; the seams get wired the day those surfaces land.

The deprecated mixins/ splice crate (same package name, [[module]] paste row, old 3fb4c31 pin) is removed from the repo and package; the model-wrap seams live in the main crate's src/mixin modules.

Licence: MIT. Source: https://github.com/Sparticle62ops/horizon-show-me-your-skin
"""
