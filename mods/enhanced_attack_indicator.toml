description = """enhanced-attack-indicator (Horizon Rust port), slice 1: the indicator model. NOTE: the master repo keeps this port as src/lib.rs + modules; this bundle inlines the modules into one runtime.rs file, compile-equivalent, for the single-module .hnmod format.  1:1 port of the upstream logic core (MIT): the vanilla attack indicator is replaced by selectable variants (the horizontal bar under the crosshair, or the circumferential arc around it), driven by the vanilla attack cooldown with the mod's charge/fill colors. Render hooks land in the next slice.

Port by sparticle. Upstream: https://github.com/Minenash/Enhanced-Attack-Indicator (MIT).

Pinned to Horizon 3fb4c31 and horizon-mixins d9c83d7; exact 1:1 Rust port tested against those revisions.

Licence: MIT. Source: https://github.com/Sparticle62ops/horizon-enhanced-attack-indicator
"""
