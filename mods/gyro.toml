id = "gyro"
kind = "native-mod"
name = "Gyro"
summary = "Full 6DOF flight physics and immersive gyro camera tilt for Minecraft Horizon, inspired by Do a Barrel Roll."
description = """
**Fly an elytra like an aircraft.** Gyro swaps Horizon's locked horizon for full six-degree-of-freedom control: bank into a roll, pull through it to carve a turn, push the nose past vertical and loop. Inspired by the feel of the Java mod *Do a Barrel Roll*, written from scratch on Horizon's native hook points.

| While gliding | What it does |
|---|---|
| Mouse left / right | Roll — a full 360° with no snap-back |
| Mouse up / down | Pitch through your current bank, so a wing-down pull carves a turn |
| `A` / `D` | Rudder yaw for fine heading corrections |

In third person your avatar, elytra and held item stay pinned to the camera while the world, sky and entities roll around you. When you stop gliding, the view eases back to level and the mouse is an ordinary camera again. Everything else stays vanilla — no keybinds, no config, no setup, just one row in **Options > Mods**.

**What it actually touches.** Client-side camera matrices and the player's own model only. There is no network, filesystem or process access anywhere in the source, no server hooks and no server component; the server never hears about the roll. It declares `hooks: 3`, so the launcher builds it on any Horizon whose native hook API is ≥ 3 rather than one pinned commit. Built and tested against Horizon `e14b35ce` (Nightly 2026-11-11) with horizon-mixins `e59da90`. One honest caveat: three of the six hooks sit on Horizon's own private functions, so when Horizon moves one of those functions — as the 2026-11-10 Nightly moved `apply_mouse_look` and `mobs::render` — the bundle needs the new path and we publish it as a new version. The registry's nightly check tells us, and the launcher warns before an install it knows is broken. The whole mod is seven short Rust files plus one mixin manifest under `mixins/gyro/` — read them before you build.

*Native mods are unsandboxed code running with your account's permissions; install only from authors you trust.*

Source & build guide: https://github.com/CGRLabs/gyro

Community discovery & mod docs: https://horizon-hub-seven.vercel.app (independent, unofficial — indexes the official registry)"""
