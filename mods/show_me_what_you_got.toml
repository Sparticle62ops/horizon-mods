id = "show_me_what_you_got"
kind = "native-mod"
name = "show_me_what_you_got"
summary = "A Horizon port of Show Me What You Got."
description = """show-me-what-you-got ported to Horizon as a native Rust mod.  Upstream: https://github.com/apace100/show-me-what-you-got at commit 0ee8852 (2023-11-18), MIT (c) 2022 apace100. 1:1 port of the mod core: the SmwygItemMatch model, the per-sender MessageItemList (take-on-read, cleared on server start), the [[smwyg:...]] tag regex + SNBT extraction and chat decoration, the share-item packet (varint start/end + compound NBT) with the server receiver's deferred add, the shared chat text-field insertion state machine (cursor/selection/erase/write clamping math from TextFieldWidgetMixin, suggestion-offset tracking, stale-link handling), the chat screen send flow (tagged history entry, packet send, no history duplicate), and the client tick share gate (left-ctrl + chat key opens the chat with the focused slot's stack, latch semantics 1:1).

Port by sparticle. Upstream: https://github.com/apace100/show-me-what-you-got (MIT).

Honest status: nothing of this is visible in game yet. The client mod API has
no client tick hook, no chat hook and no packet registration surface, so no
item is shared in game: the packet, chat and key hooks of the original have
nothing to register on. The logic runs its tests; the three seams stay
recorded in the source README and get wired the day those surfaces land.

Package ships the full modular source (src/runtime.rs + the mod API entry)
on the current SDK (Horizon f00125f)

Licence: MIT. Source: https://github.com/Sparticle62ops/horizon-show-me-what-you-got
"""
authors = ["apace100", "sparticle"]
owners = ["Sparticle62ops"]
