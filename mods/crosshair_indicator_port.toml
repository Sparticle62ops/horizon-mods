id = "crosshair_indicator_port"
kind = "native-mod"
name = "Crosshair Indicator"
summary = "Dynamic target reach awareness: visual feedback on your crosshair when hovering over an entity in attack range."
description = """Exact 1:1 Rust port of [Crosshair Indicator](https://github.com/CayMac97/crosshair-indicator)
(MIT, CayMac), itself a 1:1 port of AmerDz01's Java Crosshair Indicator mod; carries the upstream
license and credit. Port by sparticle.

Your crosshair tells you when the mob or player you aim at is within attack reach: the target
indicator picks one of four styles (corner brackets, center dot, diamond pips, chevron above the
crosshair), the color theme follows the weapon's charge state (classic white, dynamic
green/orange, combat red, pink, diamond cyan, gold), and an optional thin cooldown bar sits below
the crosshair while the weapon charges.

The mod API wires the original's four settings: the enabled and cooldown-bar toggles live on the
Options > Mods page (same defaults); the style and theme pickers stay config-file entries because
the settings API only takes toggles and ranges.

Listed under this fresh id: the original `crosshair_indicator` entry is archived, its owner keys
are the archived author's, and its versions are signed under that key, so a reactivated entry
cannot take a new version. The archived entry stays archived and untouched.

Source-only .hmod built on the current SDK (Horizon f00125f, mixins e59da909, mod api 0.2).

Licence: MIT (upstream text). Source: https://github.com/Sparticle62ops/horizon-crosshair-indicator
"""
authors = ["CayMac", "sparticle"]
owners = ["Sparticle62ops"]
owner_ids = [209812745]
license = "MIT"
