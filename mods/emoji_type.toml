id = "emoji_type"
kind = "native-mod"
name = "emoji_type"
summary = "A Horizon port of Emoji Type."
description = """Typing a `:code:` shortcode in Horizon chat replaces it with its emoji when the
message is sent. A Rust port of [Emoji Type](https://modrinth.com/mod/emoji-type)
by Norbiros (co-author CyborgCabbage), licensed GPL-3.0-only like the original.

The three emoji packs bundled with the original mod (minecraft, text art faces,
letters) ship inside this mod and are copied into `config/emoji_type/emoji_packs/`
on first load, never overwritten. Every `.yaml` or `.yml` pack in that folder is
loaded alongside them, so custom packs can be dropped in the same way the original
loads them from its config. The config (`config/emoji_type/config.json`) tracks
which packs are enabled and carries the original's v2 legacy migration from
`emojitype.json`.

The replacement rides the mod API's client_chat hook, so it works with no other
mod installed; slash commands keep bypassing it, as in the original. The original
also replaces codes in the edit box as they are typed and shows code suggestions;
that in-field stage, plus the pack config UI, lands as a later phase on the screen
hooks.

Source-only .hmod built on the exact SDK pin (Horizon f00125f)

Licence: GPL-3.0-only. Source: https://github.com/Sparticle62ops/horizon-emoji-type
"""
authors = ["Norbiros", "CyborgCabbage", "sparticle"]
owners = ["Sparticle62ops"]
owner_ids = [209812745]
license = "GPL-3.0-only"
source = "https://github.com/Sparticle62ops/horizon-emoji-type"
icon = "icons/emoji_type.png"
categories = ["utility"]
tags = ["port", "horizon"]

