id = "litematica"
kind = "native-mod"
name = "Litematica"
summary = "Schematics for Horizon."
description = """Schematics for Horizon. Exact 1:1 Rust port of [Litematica](https://github.com/maruohon/litematica) (LGPL-3.0-only, upstream LICENSE shipped in the package), ported for the Horizon client by sparticle.

## What ships today

Phase 1, compiled and tested on the pinned SDK: the schematic data model with multi-region containers, the .litematic (NBT) reader/writer, the bit-packed BlockStates array matching the format's palette rule (max(ceil(log2(palette)), 2), LSB-first across i64 words, y-major ordering), gzip with a dependency-free stored/inflate codec, placements with turns and mirrors, the ghost overlay for previews, verification against a placed region, the print order, materials lists, and the /litematica command surface (load, save, savearea, verify, clipboard, build). 58/58 tests.

## Hardening

The NBT reader caps nesting at 512 levels and array lengths by the bytes actually left (a crafted .litematic claiming a 2^31-element array aborts the old reader); negative lengths are rejected. Region loads cap the volume at 8,388,608 blocks (the same cap the saver applies), use checked size arithmetic, bounds-check index/get/set, and map palette indices past the end to air. /litematica save, save and savearea paths are sandboxed to the mod's ./schematics folder.

## Horizon feature gaps, tracked on horizon-rust/horizon

- World render primitives: the ghost overlay draws translucent filled boxes with outlines; Horizon has no client surface to add primitives to the world render yet, so the overlay wires to it when it lands. (A dedicated issue is linked from the PR.)
- Client command surface with world reads: /litematica's commands run in the client command hook, which has no access to the game, so reading the world (verify against real placed blocks, savearea from the selection box, clipboard copy, the printer walking placements into block changes) needs a client surface that reaches the open world. (A dedicated issue is linked from the PR.)

Pinned to Horizon f00125f61f794aaa3d4e950d301f353b35b6ee3d, horizon-mixins e59da9094f0c2fdda6c627fe9eff22dec6a906f0 and mod API 0.2; exact 1:1 Rust port tested against those revisions.

Licence: LGPL-3.0-only (upstream, carried, with the upstream notice and credit to maruohon). Source: https://github.com/Sparticle62ops/horizon-litematica
"""
