id = "statuseffectbars"
kind = "native-mod"
name = "statuseffectbars"
summary = "A Horizon port of Status Effect Bars."
description = """Exact 1:1 Rust translation of [Status Effect Bars](https://github.com/A5b84/status-effect-bars)
(upstream Java, LGPL-3.0-or-later per fabric.mod.json; Modrinth lists LGPL-3.0-only),
master @7c00964 (2026-06-18), by A5b84.

Ported for the Horizon client by sparticle. Upstream credit: A5b84.

- The fabric client entrypoint `StatusEffectBars` maps to the mod's
  `#[mod_api::horizon_mod]` entry in `src/lib.rs`; `status_effect_bars::on_initialize_client`
  stays the init point.
- The ModMenu config-screen entrypoint joins the config-screen batch later,
  as with the other ports.
- Mixins: `HudMixin`, `EffectsInInventoryMixin`, `LivingEntityMixin`,
  `MobEffectInstanceMixin` (adds the `maxDuration` attribute used for
  rendering), all carried 1:1 with host seams. The engine `[[native.mixin]]`
  rows are pending target verification, so no bars show in game yet.

Build: `cargo test` (17 tests), run from the package source.

Package rebuilt on the current SDK (Horizon f00125f61f794aaa3d4e950d301f353b35b6ee3d, mixins e59da9094f0c2fdda6c627fe9eff22dec6a906f0); the package source and the repo match (main @7b4b026). Upstream's COPYING and COPYING.LESSER ship with the package.

Licence: LGPL-3.0-or-later. Source: https://github.com/Sparticle62ops/horizon-status-effect-bars
"""
authors = ["A5b84", "sparticle"]
owners = ["Sparticle62ops"]
owner_ids = [209812745]
license = "LGPL-3.0-or-later"
source = "https://github.com/Sparticle62ops/horizon-status-effect-bars"
icon = "icons/statuseffectbars.png"
categories = ["utility"]
tags = ["port", "horizon"]

