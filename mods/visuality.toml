## Horizon registry entry for Visuality (port of PinkGoosik/visuality).
id = "visuality"
kind = "native-mod"
name = "Visuality"
summary = "Particle visuals, ported 1:1: rain and snow circles on water, hit particles, soul puffs, sparkles, and creeper charge."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launcher's Mods page, then press Build there). Native mods are not sandboxed and run with your account's rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- Rain and snow circles on water surfaces, with the spawn-condition, density-roll and radius-offset math kept.
- Hit particles when mobs are hurt (attacker's attack-damage stat sets the count), plus the sparkles on baby zombies and sneaking self-view gates.
- Sprint soul puffs near wither-summon bases, soul particles above those bases, sparkles on shiny blocks and amethyst clusters, and the creeper charge particle when powered.

Port of [Visuality](https://github.com/PinkGoosik/visuality) by PinkGoosik (MIT, read upstream at commit fd8e592); credited upstream, original license preserved. Upstream's slime path stays out because upstream ships it commented out; the README documents it.
"""
