id = "smoothswapping_sparticle"
kind = "native-mod"
name = "Smooth Swapping"
summary = "A Horizon port of Smooth Swapping."
description = """Exact 1:1 Rust translation of [Smooth Swapping](https://modrinth.com/mod/smooth-swapping)
(Schauweg, LGPL-3.0-only, branch 26.3/dev @88e2988) for Horizon.

Upstream logic carried 1:1 in `smoothswapping/runtime.rs` as a Horizon
client runtime splice (`crates/horizon-client/src/game.rs`): Vec2 (including
the Java `=-` negation quirk), SwapStacks, the swaps trio (InventorySwap,
ItemToCursorInventorySwap, ItemToItemInventorySwap) behind the AnySwap enum,
the SmoothSwapping state object (serde_json in place of Gson; snake_case
field naming and pretty printing match upstream), SwapUtil (quadrants,
i2i/i2c assignment, hasArrived), the CatmullRomWidget config set, the config
manager, and the mixin set. Engine injection points are wired through
`[[native.mixin]]` rows; see the README for the wiring state.

Ported by sparticle.

## License

Upstream Smooth Swapping is LGPL-3.0-only, Copyright (c) Schauweg. This
port carries the upstream license and credit per the port policy.

Pinned to Horizon f00125f61f794aaa3d4e950d301f353b35b6ee3d and
horizon-mixins e59da9094f0c2fdda6c627fe9eff22dec6a906f0; exact 1:1 Rust port
tested against those revisions.

Licence: LGPL-3.0-only. Source: https://github.com/Sparticle62ops/horizon-smooth-swapping
"""
