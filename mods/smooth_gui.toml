id = "smooth_gui"
kind = "native-mod"
name = "smooth_gui"
summary = "Screens ease open instead of popping (Smooth GUI port)."
description = """Smooth GUI, a native mod: screens ease open instead of popping. An unofficial, independent port of Ezzenix's Smooth GUI (MIT); not affiliated with Ezzenix. No code, assets, textures or lang files from the original Java mod are included.

Ported 1:1: all ten EasingStyle styles with their exact formulas, AnimationDirection and ScreenMode, every ModConfig field with its default and range, getScreenMode/nextScreenMode, and the SmoothGui static logic core (blocked-screen lists, onRender, onScreenChanged with the curios-compat branches, getAlphaSince, calculateDisplacement with upstream's double scale multiply, push/pop/wrap/wrapInverse). The config fields are Horizon settings (Options > Mods) with the same defaults and ranges; /smoothgui (short form /sg) reads and writes them.

Honest status: nothing in game yet - the client mod API has no screen callback surface (no onRender, onScreenChanged, or graphics push/pop), so the logic runs its tests and stays unwired until that lands.

Licence: MIT (the logic core carries Ezzenix's MIT). Source: https://github.com/Sparticle62ops/horizon-smooth-gui

Built on the current SDK (Horizon f00125f, mixins e59da909, mod API 0.2).
"""
authors = ["Ezzenix", "sparticle"]
owners = ["Sparticle62ops"]
