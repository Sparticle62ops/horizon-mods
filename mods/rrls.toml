id = "rrls"
name = "Remove Reloading Screen"
version = "1.0.0"
description = """Background resource reloads for Horizon. Exact 1:1 Rust port
of Remove Reloading Screen (upstream https://github.com/dima-dencep/rrls,
OSL-3.0, upstream licence and credit carried).

## What ships today

The full translated mod: the config data model (every upstream field with its
released defaults) loaded from config/rrls.json and saved on changes, the
reload bookkeeping (ReloadersFuture shared state), the texture and atlas
reload queues with single-flight dedupe, the overlay helper state machine and
its screen-kind handling, the animation and easing math (34 easing curves,
interpolation, RGB progress), the screens and services translations, and the
translated mixin logic the overlay drives.

## Settings

15 of the 17 config fields register on the mod's Options > Mods page with
upstream labels: overlay hiding, block-overlay, mini render, scissor, the
overlay display type, RGB progress, both interpolation toggles, the easing
curve, animation speed, reset-resources, re-init-screen, early pack-status
send, double-load and skip-(Neo)Forge-overlay. Two fields stay file-held in
config/rrls.json because the settings API has no string or optional-number
field kind yet: reload_text and easing_arg.

## Horizon feature gaps, tracked on horizon-rust/horizon

1. Resource-reload lifecycle events. Upstream replaces the vanilla
   resource-reload screen and runs reloads in the background; the mod API
   carries no reload-lifecycle or screen-replacement surface, so the
   translated overlay logic cannot take over the reload screen yet and the
   vanilla screen stays. When the surface lands, the logic wires to it
   as-is (tracked under horizon-rust/horizon #15868).
2. HUD overlay draw. The custom overlay draws through the game's GUI pose
   stack and texture draw; the mod API carries no HUD sprite/pose draw
   surface for a mod crate, so the render path stays behind the seams.
3. Resource-pack status channel. The early pack-status send rides the
   server resource-pack protocol; the mod API carries no channel to send
   it on, so that path stays a seam.

Pinned to Horizon f00125f61f794aaa3d4e950d301f353b35b6ee3d, horizon-mixins
e59da9094f0c2fdda6c627fe9eff22dec6a906f0 and mod API 0.2; exact 1:1 Rust
port tested against those revisions.

Licence: OSL-3.0 (upstream, carried, with the upstream notice and credit to
dima_dencep). Upstream: https://github.com/dima-dencep/rrls.
Source: https://github.com/Sparticle62ops/horizon-rrls
"""
authors = ["dima_dencep", "sparticle"]
license = "OSL-3.0"
homepage = "https://github.com/Sparticle62ops/horizon-rrls"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f00125f61f794aaa3d4e950d301f353b35b6ee3d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
