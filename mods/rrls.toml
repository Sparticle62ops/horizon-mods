## Horizon registry entry for Remove Reloading Screen (behavioral clean-room port of the OSL-3.0 mod).
id = "rrls"
kind = "native-mod"
name = "Remove Reloading Screen"
summary = "Background resource reloads: reload lifecycle tracking, overlay visibility policy, RGB text tint, force-close."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- **Background reload lifecycle**: a cycle tracks the expected resource reloads, finishes when all land (a no-op cycle finishes immediately), and a newer cycle supersedes a live one.
- **Overlay policy**: vanilla mode keeps the overlay only while a reload is live; `rgb` adds a text tint cycling by finished count; `hidden` suppresses it after the first (startup) load.
- **Config**: `enable`, `hide_type` (vanilla/rgb/hidden), `force_close`, `skip_vanilla_overlay`; unknown keys ignored, malformed values keep their current value.

Behavioral clean-room port of [Remove Reloading Screen](https://modrinth.com/mod/rrls) (OSL-3.0): no upstream code or assets are included, ported under CC0-1.0. Degradation: Horizon loads resource packs synchronously and owns its loading overlay, so the actual background load is a host seam; the port ships the full policy logic (14 tests) and the overlay hooks the client needs, with the seam tracked under horizon-rust/horizon #15868 and the port upgrading to full 1:1 when the hooks land. Ported to Rust by sparticle.
"""
