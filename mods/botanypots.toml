changelog = """Repair, slice 2, and the operator gate. 0.2.0 could not load: it carried 131 crop, soil, interaction and fertilizer recipe files whose serializers do not exist at this pin, so Horizon refused the pack and the game exited (those files are dropped: 168 content files down to 37). Slice 2 adds the hopper pot: 15 slots, self-harvest on the tick with no click, and the storage pushed into the container below, with the harvest's overflow no longer destroyed. `/botanypots info` was level 0, so any player could read any pot's soil, seed and growth at coordinates of their choosing, and a non-pot position echoed that block's id; it is now `Command::op(…, 2)` with a body re-check, and a position holding no pot answers only that it is not a botany pot. Proven in game: an operator reads the pot, a non-pot position answers `not a botany pot`, and a level-0 LAN guest is refused `/botanypots info` while `/help` and `/list` answer that same guest — so the refusal is the gate, not guest commands being switched off."""
