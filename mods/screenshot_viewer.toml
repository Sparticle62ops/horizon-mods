changelog = "Review r2: the package ships the full modular source with the launcher-facing mod API entry (no [[native.module]] mount), upstream's MIT LICENSE (LGatodu47, 2026) carried verbatim, the slice-1 description now says exactly what the version does (the model holds the delete action; the screen, disk delete and clipboard write are slice 2), and the empty-gallery test name matches its assertion. 5 tests green on the pinned SDK."
