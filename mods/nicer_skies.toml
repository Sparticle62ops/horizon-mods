id = "nicer_skies"
kind = "native-mod"
name = "nicer_skies"
summary = "A Horizon port of Nicer Skies."
description = """Exact 1:1 Rust translation of [Nicer Skies](https://modrinth.com/mod/nicer-skies)
by ZtereoHYPE (github.com/ZtereoHYPE/nicer-skies, v1.5.2, LGPL-3.0-only).
The upstream LGPL-3.0-only license and credit are carried; see COPYING.LESSER.
Ported to Rust by sparticle.

Every upstream Java class maps 1:1 to a Rust module (see the module header in
`src/lib.rs` for the full mapping): the twinkle-star field
and its acceptance/noise rules, the cubemap skybox with the six-face paint
executor and latch, the nebula gradient stack (Shepard-interpolated keys,
altitude and time integration, domain-warped noise colors, hermite seam
smoothing), the config screen with the scale slider value mapping, and both
mixin handlers with their exact injection points.

Every Minecraft client type the port touches sits behind the host seams in
`src/seams.rs` (renderer, mesh builder, textures, executor, GUI, profiler,
noise math), a thin surface the engine binds. Log lines, field names, branch
order and quirks are kept as-is.

Launcher-native source-only .hmod on the current SDK (Horizon f00125f):
the package carries `horizon-mod.toml` and a registry-only `Cargo.lock`
regenerated by `horizon-launcher native-lock`; the legacy flat bundle
(`mixins/nicer_skies/runtime.rs`) is removed, the port lives under `src/`.

Upstream licence: LGPL-3.0-only (Modrinth), carried as written. Source: https://github.com/Sparticle62ops/horizon-nicer-skies
"""
authors = ["ZtereoHYPE", "sparticle"]
owners = ["Sparticle62ops"]
owner_ids = [209812745]
license = "LGPL-3.0-only"
source = "https://github.com/Sparticle62ops/horizon-nicer-skies"
icon = "icons/nicer_skies.png"
categories = ["utility"]
tags = ["port", "horizon"]

