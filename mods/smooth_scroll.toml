id = "smooth_scroll"
kind = "native-mod"
name = "smooth_scroll"
summary = "A Horizon port of Smooth Scrolling."
description = """Smooth Scrolling, a native mod: container, chat, creative-screen, entry-list and text-field scrolling animates smoothly instead of stepping. An unofficial, independent port of SmajloSlovakian's Smooth Scrolling (GPL-3.0-only); not affiliated with SmajloSlovakian. No code, assets, textures or lang files from the original Java mod are included.

Ported 1:1: the whole config model (CfgValue, CfgValueBuilder, NewConfig, SmScCfg with the format data corrections), SmoothSc/Globals statics, the menu module, the duck interfaces and TransformationAccess, and the client mixins' logic (hotbar smoothness and rollover, chat and suggestion-window smoothness and speeds, creative-screen smoothness with RP compatibility mode, entry-list smoothness and speed, text-input smoothness, speed and cursor margin, touchpad inertia thresholds, merged-scroll handling). The config fields are Horizon settings (Options > Mods) with the same defaults and ranges; /smoothscroll (short form /ss) reads and writes them.

Honest status: nothing scrolls smoothly in game yet - the client mod API has no mouse-wheel / scroll-event surface for container, creative, chat or entry-list screens, and no text-field cursor surface, so the logic runs its tests and stays unwired until that lands.

Licence: GPL-3.0-only, the upstream license, carried with credit. Source: https://github.com/Sparticle62ops/horizon-smooth-scroll

Built on the current SDK (Horizon f00125f, mixins e59da909, mod API 0.2).
"""
authors = ["SmajloSlovakian", "sparticle"]
