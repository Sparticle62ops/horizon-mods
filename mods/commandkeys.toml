id = "commandkeys"
kind = "native-mod"
name = "commandkeys"
summary = "A Horizon port of CommandKeys."
description = """Exact 1:1 Rust translation of [CommandKeys](https://github.com/TerminalMC/CommandKeys)
(upstream Java, Apache-2.0) by TerminalMC. Carries the upstream license and credit.

Ported for the Horizon client by sparticle.

Client-side chat macros on hotkeys: profiles of macros, each macro a list of
messages with a primary and optional alternate keybind, per-message delays
(`delayTicks`), send modes (SEND, TYPE, EDIT, CYCLE, RANDOM, REPEAT with
`spaceTicks` and `maxRepeats`), activation types (HOLD, VANILLA, RELEASE),
dual-key activation (`keybind.limitKeyName` must be held), conflict
strategies (SUBMIT, ASSERT, VETO, AVOID), per-macro placeholder substitution,
a global ratelimit, the chat length limit and automatic per-world/per-server
profile switching via `links`.

## Mod API wiring (rebuild)

- The config key (`K`) and the macros' activator keys register as key
  mappings with the upstream conflict contexts; releases clear held state on
  every input event, and the dispatch path gates itself on the open screen
  like upstream's `handleKey`.
- The trigger path runs through the input, mouse and client-tick hooks; chat
  sends go through the network host, and the `/commandkeys` command tree
  registers as client commands.
- The config lives at the mod data dir's `commandkeys.json`,
  schema-compatible with the original's, written back when a load
  substituted defaults.

## Tracked seams

- Chat lines arrive without their translation keys on the SDK, so the
  incoming-PM placeholder scan cannot match until one lands.
- A chat component's resolved text is not readable through the API surface,
  so recorded lines carry no content.

Source-only .hmod built on the current SDK (Horizon f00125f, mixins e59da909,
api 0.2). 23 cargo tests green.

Licence: Apache-2.0. Source: https://github.com/Sparticle62ops/horizon-commandkeys"""
