id = "commandkeys"
kind = "native-mod"
name = "CommandKeys"
summary = "Port of CommandKeys: bind keys to macros of chat messages and commands with per-message delays."
description = """Rust port of [CommandKeys by TerminalMC](https://github.com/TerminalMC/CommandKeys) (Apache-2.0); this port keeps Apache-2.0.

Bind keys to macros: lists of chat messages and commands with per-message delays, so one keypress runs a whole routine. Config lives where the original put it (`config/commandkeys.json`).

Known degradations against the original, where Horizon hooks are still missing, are listed in the port's README and tracked as API asks on horizon-rust/horizon.

Tested against Horizon `3fb4c3138e0c5d8fdd2fdb555cf31368e8897497` with Horizon Mixins `d9c83d7096b7ea5b83678da2efdfd6161f74997e`.

Source and port notes: [github.com/Sparticle62ops/horizon-commandkeys](https://github.com/Sparticle62ops/horizon-commandkeys)."""
authors = ["Sparticle62ops"]
owners = ["Sparticle62ops"]
