id = "simplylight"
kind = "mod"
name = "Simply Light"
summary = "160 decorative light-emitting blocks and panels in every colour."
description = """
A Horizon port of [Simply Light](https://github.com/Flanks255/simplylight) by **Flanks255** (MIT): the blocks, states, models, textures, recipes and tags are data in the package, and it has no native code and no hooks. 160 blocks in ten families, 2,048 blockstates, the jar's light levels, self-drop loot, six recipes and the climbable/mineable tags.

MIT: the original copyright and licence travel inside the archive (`data/simplylight/license/`), not only in the source repository. Built for mod API 0.2 on Minecraft 26.3.
"""
