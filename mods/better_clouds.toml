name = "better_clouds"
summary = "A Horizon port of Better Clouds."
description = """Exact 1:1 Rust translation of [Better Clouds](https://github.com/Qendolin/better-clouds)
(upstream Java, MPL-2.0), master @d6c33c0 (fix(b3d): make sure render pass is not closed),
by Qendolin. Carries the upstream MPL-2.0 license and credit.

Ported for the Horizon client by sparticle. Upstream credit: Qendolin.

The bundle inlines the ported module tree into one `runtime.rs` (compile-equivalent;
`generator/path.bin` is inlined as a byte literal in place of `include_bytes!`).

Known seams (engine-stage, none are Horizon API gaps): the renderdoc full port
(upstream `RenderDoc.java`/`RenderDocLoader.java`) is pending and rides the seam
surface; CategoryTab/PlaceholderTab config-GUI widgets ride the tab-handle seam;
the mixin carrier splice, ConfigManager serialized config load, EventHooks/ModLoader
backend resolution and `PresetLoader.ALL_PRESETS` resource population wire in at
engine stage.

Pinned to Horizon 3fb4c31 and horizon-mixins d9c83d7; exact 1:1 Rust port tested against those revisions.

Licence: MPL-2.0. Source: https://github.com/Sparticle62ops/horizon-better-clouds
"""
