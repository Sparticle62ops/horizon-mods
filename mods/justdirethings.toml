changelog = """Slice 2, the generator's redstone control: the four upstream modes (ignore, low, high, pulse) on `RedstoneControlledBE`, the base-class behaviour every later Just Dire Things machine inherits. Three saved keys, one tick gate, and the payload carries the recorded edge so a pulse fires once per edge. A defect found in the in-game leg and fixed: the tick replied `Unchanged` when nothing burnt, which discarded the recorded falling edge, so the second pulse bought no burn — the reply now persists when anything burnt, a fuel item was pulled, or the redstone control changed. Two of the port's own gap claims were corrected from the jar rather than copied: upstream has no comparator output in 1.5.7, and the mode set is four, not "beyond ignored". Proven in game: high runs only while powered, low freezes while powered, pulse buys 1,500 FE per edge with the stick count falling 4 to 3 to 2 while a held signal buys nothing, and a guest 40 blocks away is refused both commands while one a block away is allowed."""
