name = "Continuity"
summary = "Efficient connected textures: OptiFine-style CTM rules, 8-neighbor masks, 47/5/4/random tile selection."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- **OptiFine-style rules**: `.properties` CTM rule files parse as packs already ship them (`matchBlocks`, `method`, `tiles` names or ranges, `#` comments, unknown keys ignored).
- **Five methods**: `ctm` (canonical 47-tile layout, inner corners included), `ctm_compact` (5-tile orthogonal), `horizontal` and `vertical` (4-tile), `random` (deterministic seeded pick).
- **First match wins**: a pack's rules resolve in order; out-of-range tile indices saturate instead of crashing.

Behavioral clean-room port of [Continuity](https://modrinth.com/mod/continuity) (LGPL-3.0-only): no upstream code or assets are included, ported under CC0-1.0. Degradation: Horizon has no resource-pack seam to swap block-model quad UVs by pack texture at render time, so the port ships the full policy logic (17 tests) while the draw stays stock; the seam is tracked under horizon-rust/horizon #15369 and the port upgrades to full 1:1 when it lands. Ported to Rust by sparticle.
"""
