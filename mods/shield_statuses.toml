id = "shield_statuses"
kind = "native-mod"
name = "Shield Statuses"
summary = "Port of Walksy's Shield Statuses: tints shields by whether they are live or axe-disabled, with cooldown fade-in."
description = """A port of [Walksy's Shield Statuses](https://github.com/Walksy/ShieldStatus) (MIT, (c) Walksy): it tints players' shields by whether the shield is disabled, so you can see at a glance whether a shield is live or axe-disabled, and estimate when it comes back.

Behavior is 1:1 with upstream: enabled shields show the enabled color, disabled shields the disabled color; with interpolation on the disabled color transitions back to the enabled color as the shield's cooldown runs out; the shown-players setting gates whose shields are tinted (self only, others only, or all) and the keybind toggles it; with the mod off, no tint anywhere.

The shield-cooldown facts arrive through the client packet hook, which hears the cooldown reports the server sends this client. Known seams, tracked as API asks on horizon-rust/horizon: Horizon has no held-item render hook yet, so the tint cannot reach the shield model until that surface lands (the logic is complete and ready for it), and other players' shield states are server-assisted upstream through WalksyLib, with no Horizon equivalent.

Tested against Horizon `3fb4c3138e0c5d8fdd2fdb555cf31368e8897497` with Horizon Mixins `d9c83d7096b7ea5b83678da2efdfd6161f74997e`.

Source and port notes: [github.com/Sparticle62ops/horizon-shield-statuses](https://github.com/Sparticle62ops/horizon-shield-statuses)."""
authors = ["Sparticle62ops"]
owners = ["Sparticle62ops"]
