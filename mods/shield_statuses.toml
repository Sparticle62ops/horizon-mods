## Horizon registry entry for Shield Statuses (port of Walksy/ShieldStatus).
id = "shield_statuses"
kind = "native-mod"
name = "Shield Statuses"
summary = "Tints players' shields by live or axe-disabled state, with cooldown interpolation and shown-players gating."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launchers Mods page, then press Build there). Native mods are not sandboxed and run with your accounts rights, so read the source before you build it. Pinned to the Horizon tree this was built against.

- Enabled shields show the enabled color, disabled shields the disabled color.
- With interpolation on, the disabled color gradually transitions back to the enabled color as the cooldown runs out.
- The shown-players setting gates whose shields are tinted: self only, others only, or all; a keybind cycles it.
- Cooldown facts arrive through the client packet hook, so it works on real servers.

Port of [Shield Statuses](https://github.com/Walksy/ShieldStatus) by Walksy (MIT); credited upstream, original license preserved. Degradation vs upstream: the held-item render redirect seam is tracked on horizon-rust/horizon #10074.
"""
