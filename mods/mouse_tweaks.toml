id = "mouse_tweaks"
kind = "native-mod"
name = "Mouse Tweaks"
summary = "Port of MouseTweaks: drag items between slots with the mouse, wheel scrolling, and shift-drag, 1:1 with the original."
description = """A Rust port of [MouseTweaks](https://github.com/YaLTeR/MouseTweaks) (BSD 3-Clause, (c) 2023 Ivan Molodetskikh), 1:1 behavior for Horizon native mods: drag items between slots with the mouse, scroll with the wheel, and shift-drag, using the original's config keys.

Settings are driven by the `/mousetweaks` command instead of the original's MouseTweaks.cfg. The original's BSD 3-Clause licence and notice are preserved in the bundle's LICENSE.

Tested against Horizon `3fb4c3138e0c5d8fdd2fdb555cf31368e8897497` with Horizon Mixins `d9c83d7096b7ea5b83678da2efdfd6161f74997e`.

Source and port notes: [github.com/Sparticle62ops/horizon-mouse-tweaks](https://github.com/Sparticle62ops/horizon-mouse-tweaks)."""
authors = ["Sparticle62ops"]
owners = ["Sparticle62ops"]
