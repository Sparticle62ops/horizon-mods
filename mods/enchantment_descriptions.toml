id = "enchantment_descriptions"
kind = "native-mod"
name = "enchantment_descriptions"
summary = "A Horizon port of Enchantment Descriptions."
description = """A short description right under each enchantment on the hovered item's
tooltip, dark gray: every enchantment on the stack, the held ones and an
enchanted book's stored ones. Exact 1:1 Rust port of
[Enchantment-Descriptions](https://modrinth.com/mod/enchantment-descriptions)
by Darkhax (LGPL-2.1-only, 39.7M downloads); the vanilla descriptions come
from the original's own en_us lang file.

Built on the mod API: the whole flow rides the item_tooltip hook (the
finished tooltip with mutable lines), the shift keys come through input_key,
and 4 of the 5 config entries register as settings (enable_mod,
only_display_on_books, require_keybind_press, indent_size) with upstream's
defaults; the config file stays config/enchdesc.json in the original's
camelCase and pretty printing. Descriptions ship as the original's lang file
and resolve through the game's lang layer (.desc, or .description when .desc
is missing).

Known seams (tracked):

- Name-line matching: upstream matches by component key; Horizon's tooltip
  lines carry plain text, so the port matches by rendered name text and the
  colors the game paints (gray for names, red for curses). A name the lang
  does not know gets no insertion, never a wrong one.
- onlyDisplayInEnchantingTable needs a current-screen query the mod API does
  not expose; it stays file-held at upstream's default (false).

Source-only .hmod built from the source repo on the current SDK
(Horizon f00125f, mixins e59da909). 9 cargo tests.

Upstream licence: LGPL-2.1-only (Modrinth); the port carries the upstream
licence and credit. Source: https://github.com/Sparticle62ops/horizon-enchantment-descriptions"""
authors = ["Darkhax", "sparticle"]
owners = ["Sparticle62ops"]
owner_ids = [209812745]
license = "LGPL-2.1-only"
source = "https://github.com/Sparticle62ops/horizon-enchantment-descriptions"
icon = "icons/enchantment_descriptions.png"
categories = ["utility"]
tags = ["port", "horizon"]

