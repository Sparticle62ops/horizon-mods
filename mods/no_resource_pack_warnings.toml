id = "no_resource_pack_warnings"
kind = "native-mod"
name = "no_resource_pack_warnings"
summary = "A Horizon port of No Resource Pack Warnings."
description = """A 1:1 Rust port of [no-resource-pack-warnings](https://github.com/SpaceWalkerRS/no-resource-pack-warnings)
(Space Walker, MIT). All four `PackCompatibility.isCompatible()` call sites
the mod targets are redirected to return `true`, so outdated resource/data
packs load and select with no warning screen or red border:

- `Options.updateResourcePacks` and `Options.loadSelectedResourcePacks`
  (upstream `OptionsMixin`, two redirects)
- `PackEntry.extractContent` and `PackEntry.handlePackSelection`
  (upstream `PackEntryMixin`, two redirects)

Upstream is 2 mixins, 69 lines; the port mirrors them file for file.
Credited to sparticle.

Launcher-native source-only .hmod on the current SDK (Horizon f00125f,
mixins e59da909): the package carries `horizon-mod.toml` and a registry-only
`Cargo.lock` regenerated by `horizon-launcher native-lock`. At this pin the
engine computes each pack's compatibility once, in
`horizon_client_render::packs::pack_for`; the four upstream redirect sites
read the compat it stores. The redirects are wired as two `[[native.mixin]]`
rows (kind `MODIFY_EXPRESSION_VALUE`) on `pack_for`: `compatible(&meta)` is
forced to `true` and `compatibility_for(&meta, format)` to
`Compat::Compatible`, so the click confirm, the entry rendering,
selectability and the apply and load paths all see compatible. The data-pack
screen path (`datapack.rs` calling `compatibility_for` directly) is left
untouched, as upstream leaves it.

Licence: MIT. Source: https://github.com/Sparticle62ops/horizon-no-resource-pack-warnings
"""
authors = ["SpaceWalkerRS", "sparticle"]
