id = "atomic_industry"
kind = "modpack"
name = "Atomic Industry"
summary = "Nuclear bombs, deep quarries, factories and wayfarer stones, with JEI, Jade and quality-of-life mods."
description = """
A tech pack built around industry and its consequences. Mine and automate with **Deepbore Quarry**, **Applied Energistics 2**, **ProjectE**, **Voltz** and **Factory Blocks**, travel with **Wayfarer Stones**, and when the factory is done, take it apart with **Big Nukes**.

- **Build**: AE2 storage networks, ProjectE transmutation, Voltz machines and Factory Blocks.
- **Dig**: Deepbore quarries that empty whole areas down to bedrock.
- **Travel**: wayfarer stones and scrolls between the places you know.
- **Blast**: bombs, missiles and the Sunbreaker, with fallout and bunkers to survive it.
- **Comfort**: JEI, Jade, AppleSkin, Atlas maps, Inventory Wizard, Shulker Box Tooltip, Toggle Sprint, Zoom, connected textures, extra lights and physics.

All 26 mods come from the Horizon registry, pinned by version. Install the pack, press Build and confirm the native-code warning: native mods run with your account's permissions. The full list is in the source repository."""
