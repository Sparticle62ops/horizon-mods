id = "morechathistory"
kind = "native-mod"
name = "MoreChatHistory"
summary = "Raises the chat history cap from 100 to 16384 entries."
description = """Raises the chat history cap from 100 entries to 16384. Exact 1:1 Rust port of [MoreChatHistory](https://github.com/JackFred2/MoreChatHistory) (JackFred, CC0-1.0), ported for the Horizon client by sparticle.

Upstream is one mixin: `ChatComponentMixin.morechathistory_changeMaxHistory` adds 16284 to the vanilla 100-message cap wherever the chat component enforces it (`addMessageToDisplayQueue`, `addMessageToQueue`, `addRecentChat`), taking the history from 100 to 16384 entries. This port maps that class code-for-code in `src/history.rs`, with the three capped call sites mirrored and tested; nothing else about the chat paths changes.

## Horizon feature gap, tracked on horizon-rust/horizon

- Chat history cap surface: the engine's chat component enforces the cap inline (`truncate(100)` on the display queue and the wrapped lines, `>= 100` on the recent-chat list) and the mod API has no hook that can change it, so the port's `#[mod_api::horizon_mod]` impl registers the cap values and the call-site application waits on a Horizon surface that lets a native-mod override the chat history cap (the equivalent of the mixin's constant modification). When it lands, the cap wires to it as-is. (A dedicated issue is linked from the PR.)

Pinned to Horizon f00125f61f794aaa3d4e950d301f353b35b6ee3d, horizon-mixins e59da9094f0c2fdda6c627fe9eff22dec6a906f0 and mod API 0.2; exact 1:1 Rust port tested against those revisions.

Licence: CC0-1.0 (upstream, carried, with the upstream notice and credit to JackFred). Source: https://github.com/Sparticle62ops/horizon-morechathistory
"""
authors = ["JackFred2", "sparticle"]
