changelog = """
- New water surface: soft random waves everywhere, no more lines or patterns
- Night sky: twinkling stars, a faint Milky Way and a moon path on the water
- Rainbow after the rain, puddles with rain ripples on flat ground
- Shiny ice, metal blocks, polished stone and glass, glittering snow, glowing lava
- Nether: drifting red haze and glowing embers
- End: violet light curtains and a black hole in the sky
- You can see much farther: thinner haze in all dimensions
- New Anti-Aliasing option (smooths jagged edges)
- Faster: clouds, light shafts, sun rays and bloom drawn at half resolution
- Fixed: Nether portal frames no longer turn purple
- New icon"""

