changelog = "Review r2: resubmitted under the new id shulkerboxtooltip_sparticle because the archived shulkerboxtooltip listing is DeportedToHell\'s and reactivation needs a recorded owner transfer; this is an independent port by sparticle with its own icon. The package ships the full modular source (src/**, 13 files) with a real mod API entry in src/lib.rs (bare Mod + horizon_mod Hooks on the pinned SDK), the legacy runtime.rs splice file and horizon-mixin.toml are removed, the upstream MIT LICENSE (Yanis Guaye, 2019) is at the package root, and the summary says nothing shows in game yet (no tooltip-render/keybind/packet surfaces in the client mod API). 11 tests green."
